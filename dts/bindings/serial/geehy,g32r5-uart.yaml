description: Geehy G32R5 UART controller

compatible: "geehy,g32r5-uart"

include: [uart-controller.yaml, reset-device.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  interrupt-names:
    type: string-array
    required: true
    description: |
      Must name both interrupt sources "rx" and "tx", in the order they
      appear in interrupts.

  pinctrl-0:
    type: phandles
    description: |
      Port pin configuration for RX & TX signals. 
      For example:
         pinctrl-0 = <&uarta_rx_gpio28 &uarta_tx_gpio29>;
    required: true
